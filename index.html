<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English 6 – Ôn tập giữa kỳ 1</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#667085;--accent:#2f5bea;--accent-t:#fff;--ok:#16794c;--okbg:#e3f6ec;--bad:#b42318;--badbg:#fde8e6;--line:#e0e5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--text:#e8ecf4;--muted:#9aa4b8;--accent:#6c8cff;--accent-t:#0b1020;--ok:#5dd39e;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--line:#2b3244;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--text:#e8ecf4;--muted:#9aa4b8;--accent:#6c8cff;--accent-t:#0b1020;--ok:#5dd39e;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--line:#2b3244;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:12px 20px;font-size:1rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
select{font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#timer{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
#timer.low{color:var(--bad)}
.sec h2{font-size:1.1rem;margin:0 0 2px}.ins{color:var(--muted);font-style:italic;margin:0 0 10px}
.pre{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;white-space:pre-line}
.q{padding:12px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{font-weight:600;margin-bottom:6px}
.qt img{display:block;max-height:140px;max-width:100%;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:10px;margin:5px 0;cursor:pointer}
.opt input{margin-top:5px}
.opt:has(input:checked){border-color:var(--accent);background:var(--bg)}
input[type=text]{width:100%;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important}.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.res{margin-top:6px;font-size:.95rem}.res b.g{color:var(--ok)}.res b.r{color:var(--bad)}
.score{text-align:center}.big{font-size:3.2rem;font-weight:800;color:var(--accent);line-height:1.1}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.warn{color:var(--bad);font-weight:600;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style></head><body>

{title:'C. Reading – III',ins:'Read the passage and choose the best answers to the questions.',
pre:'There is a newcomer in our class. Her name is Daisy. She is tall with curly, blonde hair. She has big blue eyes. I like her charming smile very much.\n\nAlthough she is a newcomer, she makes friends with other students easily because she is friendly, easy-going, and sociable. Most of the classmates like her. During the lessons, Daisy rarely talks when the teacher explains something. In class, she is hard-working and does all exercises. When we work in groups, she is energetic, helpful and active. She always makes everything exciting.\n\nDaisy’s house is far away from school, so she stays in the campus. After class, she takes part in a sports club of the school. She is sporty and can play volleyball well.\n\nShe enjoys reading books, going out with friends, listening to music, and hiking. She tells me she would like to become a tour guide and she also wants to travel to many other places in the world.',items:[

let n=0;SEC.forEach(s=>s.items.forEach(i=>i.id=n++));
const TOTAL=n,$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/-/g,' ').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
let ans={},end=0,tick=null,warned=false,mins=60;
const isOk=(i,v)=>v==null||v===''?false:i.t==='mc'||i.t==='tf'?v===i.a:i.a.some(a=>norm(a)===norm(v));
const answered=()=>Object.values(ans).filter(v=>v!==undefined&&String(v).trim()!=='').length;
function start(){ans={};warned=false;end=Date.now()+mins*60000;renderExam();scrollTo(0,0);clearInterval(tick);tick=setInterval(upd,500);upd()}
function home(){clearInterval(tick);app.innerHTML=`<div class="wrap"><div class="card"><h1>📘 English 6 – Mid-term 1 Review</h1><p>Tan Dong Hiep Secondary School · Units 1–3 · 2026–2027</p><p>Đề gồm <b>${TOTAL} câu</b>: Pronunciation, Word form, Reading, Grammar, Communication, Writing. Bài được tính giờ; hết giờ hệ thống tự nộp. Sau khi nộp sẽ có điểm (thang 10) và đáp án chi tiết.</p><div class="row"><label>Thời gian: <select id="mins">${[30,45,60,90].map(m=>`<option value="${m}"${m===mins?' selected':''}>${m} phút</option>`).join('')}</select></label><button class="btn" id="go">Bắt đầu làm bài</button></div></div></div>`;$('#mins').onchange=e=>mins=+e.target.value;$('#go').onclick=start}
function renderExam(){
 app.innerHTML=`<div id="bar"><div><div id="timer">--:--</div><small id="prog"></small></div><button class="btn" id="sub">Nộp bài</button></div><div class="wrap" id="exam">`+SEC.map(s=>`<div class="card sec"><h2>${s.title}</h2><p class="ins">${s.ins}</p>${s.pre?`<div class="pre">${s.pre}</div>`:''}`+s.items.map((i,k)=>qHTML(i,k+1)).join('')+`</div>`).join('')+`<div id="msg" class="warn"></div><div class="row"><button class="btn" id="sub2">Nộp bài</button></div></div>`;
 $('#sub').onclick=$('#sub2').onclick=submit;
 $('#exam').addEventListener('input',e=>{const t=e.target,id=+t.dataset.id;ans[id]=t.type==='radio'?(t.dataset.k==='T'?true:t.dataset.k==='F'?false:+t.dataset.k):t.value;warned=false;upd()});
}
function qHTML(i,k){
 let b=`<div class="qt">${k}. ${esc(i.q).replace(/\n/g,'<br>')}${i.img?`<img src="${i.img}" alt="">`:''}</div>`;
 if(i.t==='mc')b+=i.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i.id}" data-id="${i.id}" data-k="${j}"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join('');
 else if(i.t==='tf')b+=['T','F'].map(v=>`<label class="opt"><input type="radio" name="q${i.id}" data-id="${i.id}" data-k="${v}"><span><b>${v==='T'?'True':'False'}</b></span></label>`).join('');
 else b+=`<input type="text" data-id="${i.id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${i.t==='fill'?'Nhập từ cần điền':'Nhập cả câu hoàn chỉnh'}">`;
 return `<div class="q" id="q${i.id}">${b}</div>`}
function upd(){const left=Math.max(0,Math.round((end-Date.now())/1000));const t=$('#timer');if(!t)return;t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');t.classList.toggle('low',left<300);$('#prog').textContent=`Đã làm ${answered()}/${TOTAL} câu`;if(left<=0)finish()}
function submit(){const un=TOTAL-answered();if(un>0&&!warned){warned=true;$('#msg').textContent=`Còn ${un} câu chưa làm. Bấm “Nộp bài” lần nữa nếu muốn nộp luôn.`;$('#msg').scrollIntoView({block:'center'});return}finish()}
function show(i){return i.t==='mc'?'ABCD'[i.a]+'. '+i.o[i.a]:i.t==='tf'?(i.a?'True':'False'):i.a[0]}
function mine(i,v){return v==null||v===''?'(chưa làm)':i.t==='mc'?'ABCD'[v]+'. '+i.o[v]:i.t==='tf'?(v?'True':'False'):v}
function finish(){
 clearInterval(tick);let right=0;const rows=[];
 const secs=SEC.map(s=>{let r=0;s.items.forEach(i=>{if(isOk(i,ans[i.id]))r++});right+=r;return `<tr><td>${s.title}</td><td>${r}/${s.items.length}</td></tr>`}).join('');
 const score=(right/TOTAL*10).toFixed(1).replace(/\.0$/,'');
 const rev=SEC.map(s=>`<div class="card sec"><h2>${s.title}</h2>`+(s.pre?`<details><summary>Xem lại đoạn văn</summary><div class="pre">${s.pre}</div></details>`:'')+s.items.map((i,k)=>{const ok=isOk(i,ans[i.id]);
  return `<div class="q ${ok?'ok':'bad'}" style="border-radius:10px;padding:10px;margin:8px 0;border:1px solid"><div class="qt">${k+1}. ${esc(i.q).replace(/\n/g,'<br>')}${i.img?`<img src="${i.img}" alt="">`:''}</div><div class="res">${ok?'<b class="g">✓ Đúng</b> – '+esc(mine(i,ans[i.id])):`<b class="r">✗ Sai</b> – Bạn chọn: ${esc(mine(i,ans[i.id]))}<br><b class="g">Đáp án đúng:</b> ${esc(show(i))}${i.t==='write'&&i.a.length>1?'<br><small>Cách viết khác cũng đúng: '+esc(i.a.slice(1).join(' / '))+'</small>':''}`}</div></div>`}).join('')+`</div>`).join('');
 app.innerHTML=`<div class="wrap"><div class="card score"><div>Kết quả của bạn</div><div class="big">${score}/10</div><p>Đúng <b>${right}/${TOTAL}</b> câu · Thời gian còn lại ${$('#timer')?$('#timer').textContent:''}</p><table>${secs}</table><p><small>Phần Writing và Word form được chấm tự động theo đáp án mẫu; nếu em viết khác nhưng vẫn đúng, hãy hỏi thầy/cô.</small></p><div class="row" style="justify-content:center"><button class="btn" id="redo">🔄 Làm lại đề từ đầu</button><button class="btn ghost" id="wrong">Chỉ xem câu sai</button></div></div>${rev}</div>`;
 scrollTo(0,0);$('#redo').onclick=start;let only=false;$('#wrong').onclick=e=>{only=!only;document.querySelectorAll('.q.ok').forEach(x=>x.style.display=only?'none':'');e.target.textContent=only?'Xem tất cả':'Chỉ xem câu sai'}}
home();
</script></body></html>
